# Server Configuration
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Application metadata
spring.application.name=cybersecurity-awareness-platform

# Privacy and Logging: Disable HTTP request payload logging
logging.level.org.springframework.web.servlet.mvc.method.annotation=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
logging.level.com.cybersecurity=INFO

# Spring MVC static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
